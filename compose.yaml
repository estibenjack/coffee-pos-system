services:
  postgres:
    image: postgres:17
    container_name: coffee-pos-postgres
    environment:
      POSTGRES_DB: coffee_pos
      POSTGRES_USER: coffee_pos
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee_pos -d coffee_pos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: